name: CI

on:
  push:
    branches: [main, codex/admin-tools-foundation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_OUTPUT_DIR: ${{ github.workspace }}/browser-results
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format check (oxfmt)
        run: npm run format:check

      - name: Regression tests
        run: npm test

      - name: Type check and build
        run: npm run build

      - name: Static SEO pages
        run: npm run test:seo-build

      - name: Company production build
        run: npm run build:company

      - name: Company SEO and asset paths
        run: npm run test:seo-build -- /invoice/

      - name: Browser and PDF dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Browser interactions and real file exports
        run: npm run test:browser

      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: browser-results/
          if-no-files-found: warn
          retention-days: 7
